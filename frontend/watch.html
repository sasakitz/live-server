<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>視聴 | μTube</title>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main-content">本文へ移動</a>
<header class="header">
  <a href="/" class="header__brand"><span class="brand-mark" aria-hidden="true">▶</span>μTube</a>
  <nav class="header__nav" id="nav-links" aria-label="メインナビゲーション"></nav>
</header>

<main id="main-content">
<div class="player-shell">
<div class="player-wrap" id="player-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div class="player-overlay" id="overlay" role="status">読み込み中...</div>
  <div class="player-controls">
    <button id="play-btn" class="btn btn--secondary btn--sm" type="button" hidden>再生する</button>
    <button id="mute-btn" class="btn btn--secondary btn--sm" type="button" hidden></button>
    <input type="range" id="volume-slider" class="volume-slider" aria-label="音量" min="0" max="100" value="100" hidden />
    <span class="flex-spacer"></span>
    <span id="viewer-count" class="text-muted"></span>
    <button id="fullscreen-btn" class="btn btn--secondary btn--sm" type="button" aria-label="全画面表示を切り替える" hidden>⛶</button>
  </div>
</div>

</div>
<section class="container watch-meta">
  <a href="/" class="help-text">← ライブ一覧へ戻る</a>
  <div class="section-title">
    <h1 id="title">ライブを読み込み中</h1>
    <span id="live-badge"></span>
  </div>
  <p id="description" class="text-muted"></p>
  <p id="elapsed" class="help-text"></p>
  <details id="playback-info" class="playback-info">
    <summary>再生情報（途切れる場合の確認用）</summary>
    <pre id="playback-stats">配信視聴中に開くと受信状態を表示します。</pre>
  </details>
</section>
</main>

<script src="/js/common.js"></script>
<script src="/js/whep.js"></script>
<script src="/js/playback-stats.js"></script>
<script src="/js/watch.js"></script>
</body>
</html>
