<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ライブ配信一覧 | μTube</title>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main-content">本文へ移動</a>
<header class="header">
  <a href="/" class="header__brand"><span class="brand-mark" aria-hidden="true">▶</span>μTube</a>
  <nav class="header__nav" id="nav-links" aria-label="メインナビゲーション"></nav>
</header>

<main id="main-content" class="container">
  <section class="hero" aria-labelledby="page-title">
    <div>
      <h1 id="page-title">ライブ配信一覧</h1>
      <a href="/dashboard" class="btn">配信管理 <span aria-hidden="true">↗</span></a>
    </div>
    <div class="hero__status" aria-label="現在の配信状況">
      <span class="badge badge--public" id="hero-status">確認中</span>
      <strong class="hero__count" id="hero-count">—</strong>
      <span class="hero__label">現在配信中のライブ</span>
    </div>
  </section>

  <section aria-labelledby="live-heading">
    <div class="section-title">
      <div class="section-title__group"><h2 id="live-heading">配信中のライブ</h2><span class="count-pill" id="live-count" aria-live="polite">読み込み中</span></div>
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <label class="sr-only" for="stream-search">ライブを検索</label>
        <input type="search" id="stream-search" placeholder="タイトルや説明で検索" />
      </div>
    </div>
    <div id="load-error" class="notice notice--error" role="alert" hidden>
      <p id="load-error-message"></p><button id="retry-btn" type="button" class="btn btn--secondary btn--sm">もう一度読み込む</button>
    </div>
    <div id="loading" class="loading-state" role="status">ライブを読み込んでいます</div>
    <div id="live-grid" class="grid" aria-busy="true"></div>
    <div id="empty" class="empty-state" hidden>
      <span class="empty-state__icon" aria-hidden="true">▷</span>
      <h2 id="empty-title">現在配信中のライブはありません</h2>
      <p id="empty-description">配信開始時に一覧を自動更新します。</p>
      <button id="clear-search" type="button" class="btn btn--secondary" hidden>検索をクリア</button>
    </div>
  </section>
</main>
<script src="/js/common.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
