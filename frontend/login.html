<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ログイン | μTube</title>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main-content">本文へ移動</a>
<header class="header">
  <a href="/" class="header__brand"><span class="brand-mark" aria-hidden="true">▶</span>μTube</a>
  <nav class="header__nav" id="nav-links" aria-label="メインナビゲーション"></nav>
</header>

<main id="main-content" class="container container--narrow">
  <section class="card login-card" aria-labelledby="login-title">
    <h1 id="login-title">ログイン</h1>
    <p class="help-text">ユーザ名とパスワードを入力してください。</p>
    <form id="login-form">
      <div class="field">
        <label for="username">ユーザ名</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button id="login-submit" type="submit" class="btn" style="width:100%">ログイン</button>
      <p id="error" class="error-text" role="alert" hidden></p>
    </form>
    <p class="login-card__footer text-muted">アカウントについては管理者へお問い合わせください。</p>
  </section>
</main>

<script src="/js/common.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const errorEl = document.getElementById('error');
  const submit = document.getElementById('login-submit');
  if (submit.disabled) return;
  submit.disabled = true;
  submit.textContent = 'ログインしています…';
  errorEl.hidden = true;
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  try {
    await api('/api/login', { method: 'POST', body: { username, password } });
    const params = new URLSearchParams(window.location.search);
    const next = new URL(params.get('next') || '/dashboard', window.location.origin);
    window.location.href = next.origin === window.location.origin ? next.href : '/dashboard';
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.hidden = false;
  } finally {
    submit.disabled = false;
    submit.textContent = 'ログイン';
  }
});
</script>
</body>
</html>
