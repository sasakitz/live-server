<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>配信管理 | MyuTube</title>
<link rel="icon" href="/favicon.ico" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="header">
  <a href="/" class="header__brand">📡 MyuTube</a>
  <nav class="header__nav" id="nav-links"></nav>
</header>

<main class="container">
  <div class="section-title">
    <h2>配信管理</h2>
  </div>

  <div class="btn-row" style="margin-bottom:16px">
    <button id="stream-new-btn" class="btn btn--sm" type="button">＋ 新規配信</button>
  </div>

  <div class="card" id="stream-form-card" style="margin-bottom:20px" hidden>
    <h3 style="margin-top:0">新規配信</h3>
    <form id="stream-form">
      <div class="field">
        <label for="stream-id">配信ID (視聴URLに使用。作成後は変更不可)</label>
        <input type="text" id="stream-id" pattern="[a-z0-9-]+" placeholder="例: yamada-radio" required />
      </div>
      <div class="field">
        <label for="stream-title">タイトル</label>
        <input type="text" id="stream-title" required maxlength="200" />
      </div>
      <div class="field">
        <label for="stream-desc">説明</label>
        <textarea id="stream-desc" maxlength="2000"></textarea>
      </div>
      <div class="field checkbox-row">
        <input type="checkbox" id="stream-public" />
        <label for="stream-public" style="margin:0">ログインなしでも視聴可能にする(公開)</label>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn--sm">作成</button>
        <button type="button" class="btn btn--secondary btn--sm" id="stream-cancel-btn">キャンセル</button>
      </div>
    </form>
  </div>

  <div id="streams"></div>
  <div id="empty" class="empty-state" hidden>
    まだ配信がありません。「＋ 新規配信」から作成してください。
  </div>
</main>

<template id="stream-template">
  <div class="card" style="margin-bottom:20px">
    <div class="section-title mt-0">
      <h2 class="js-title" style="font-size:1.05rem"></h2>
      <span class="js-badge"></span>
    </div>

    <p class="js-viewer text-muted"></p>

    <div class="field">
      <label>視聴用URL</label>
      <div class="stream-key js-watch-url"></div>
    </div>

    <div class="field">
      <label>Stream Key (OBSに設定する秘密情報。他人に共有しないでください)</label>
      <div class="btn-row" style="margin-bottom:8px">
        <code class="stream-key js-key" style="flex:1">••••••••••••••••••••••••••••••••</code>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn--secondary btn--sm js-toggle-key">表示</button>
        <button type="button" class="btn btn--secondary btn--sm js-copy-key">コピー</button>
        <button type="button" class="btn btn--danger btn--sm js-regenerate-key">再発行</button>
      </div>
    </div>

    <details style="margin:16px 0">
      <summary style="cursor:pointer; font-weight:600">OBSの設定方法</summary>
      <div class="kv-list" style="margin-top:10px">
        <dt>サービス</dt><dd>WHIP (カスタム)</dd>
        <dt>サーバ</dt><dd><code class="inline js-whip-url"></code></dd>
        <dt>Bearer Token</dt><dd>空欄でよい(接続できない場合は上のStream Keyを入力)</dd>
        <dt>映像エンコーダ</dt><dd>H.264 (x264 / NVENC / QuickSync)</dd>
        <dt>音声エンコーダ</dt><dd>Opus</dd>
      </div>
      <p class="help-text">OBS 30以降が必要です。「設定 → 配信 → サービス」で上記を入力してください。</p>
    </details>

    <form class="js-edit-form">
      <div class="field">
        <label>タイトル</label>
        <input type="text" class="js-title-input" required maxlength="200" />
      </div>
      <div class="field">
        <label>説明</label>
        <textarea class="js-desc-input" maxlength="2000"></textarea>
      </div>
      <div class="field checkbox-row">
        <input type="checkbox" class="js-public-input" id="pub-CHECKBOX_ID" />
        <label for="pub-CHECKBOX_ID" style="margin:0">ログインなしでも視聴可能にする(公開)</label>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn--sm">保存</button>
        <button type="button" class="btn btn--danger btn--sm js-stop-btn">配信を強制停止</button>
        <button type="button" class="btn btn--danger btn--sm js-delete-btn">配信を削除</button>
      </div>
    </form>
  </div>
</template>

<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
