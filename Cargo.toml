[package]
name = "live-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws", "macros"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
rust-embed = "8.11.0"
rustls = { version = "0.23.41", features = ["aws_lc_rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "uuid", "time"] }
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["serde", "serde-human-readable"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
toml = "1.1.2"
tower-http = { version = "0.7.0", features = ["fs", "trace", "compression-gzip", "cors"] }
tower-sessions = { version = "0.15.0", default-features = false, features = ["axum-core", "private"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
webrtc = "0.17.1"
