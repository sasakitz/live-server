# WebSocket(/api/ws)アップグレード対応用のmap定義。
# httpコンテキスト直下に置く必要があるため、server{}を書くファイルとは分けている。
#
# 設置場所: /etc/nginx/conf.d/live-server-upgrade-map.conf
# (Ubuntu/Debianのnginx.confは既定で `include /etc/nginx/conf.d/*.conf;` を
#  持っているため、このファイルを置くだけで自動的に読み込まれる)

map $http_upgrade $live_server_connection_upgrade {
    default upgrade;
    ''      close;
}
