# live-server用 nginx リバースプロキシ設定例。
# 既に80/443番ポートを他のサイトでnginxが使っている環境向け(新しいserver_nameを
# 追加するだけなので、既存サイトとポートが衝突することはない)。
#
# 設置場所: /etc/nginx/sites-available/live-server
# 有効化:
#   sudo ln -s /etc/nginx/sites-available/live-server /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS化(Let's Encrypt, certbotのnginxプラグインが自動でserver{}を追記する):
#   sudo certbot --nginx -d live.example.com
#
# live.example.com は実際のドメインに置き換えること。
# WebRTCのメディア(音声/映像)はUDPで直接サーバへ到達するため、
# nginxはここでは一切関与しない(HTTP/WSの署名・API通信のみ中継する)。

server {
    listen 80;
    listen [::]:80;
    server_name live.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # /api/ws のWebSocketアップグレードに必須(live-server-upgrade-map.confのmapを使用)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $live_server_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocketやアップロードが途中で切れないよう長めに設定
        proxy_read_timeout 1h;
    }
}
